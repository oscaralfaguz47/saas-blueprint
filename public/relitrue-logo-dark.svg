    <filter id="softGlow" x="-10%" y="-30%" width="120%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#10b981" flood-opacity="0.22"/>
    </filter>
  </defs>

  <text
    x="6"
    y="72"
    textLength="288"
    lengthAdjust="spacingAndGlyphs"
    font-family="Inter, Segoe UI, Arial, Helvetica, sans-serif"
    font-size="74"
    font-weight="800"
    letter-spacing="-1.2"
    fill="url(#textGradient)"
    filter="url(#softGlow)">
    Relitrue
  </text>
</svg>
