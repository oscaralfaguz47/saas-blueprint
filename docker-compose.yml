services:
  postgres:
    # pgvector-enabled image (semantic search). Do not use plain postgres:16 locally.
    image: pgvector/pgvector:pg16
    container_name: nextjs-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: myapp_local
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
